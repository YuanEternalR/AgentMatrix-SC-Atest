# AgentMatrix-SC 工作台配置
#
# DSH_PORT：本机 DSH Web GUI 端口。
#   工作台启动时会探测这个端口：已在监听就复用该实例（日志 reuse: port already listening）；
#   没在跑就自己拉起内置引擎（profile=workbench，DSH_HOME=引擎/.dsh）。
#   DSH 换了端口时只改这里，不用动代码。
#   查端口：DSH 界面地址栏里的 http://127.0.0.1:<端口>
DSH_PORT=3083

# 说明：面板里嵌的 AgentMatrix 站点与接口由平台自己提供
#   站点   http://127.0.0.1:5173
#   接口   http://127.0.0.1:8000
# 平台启动（2026-11-23 起）：打开工作台就自动拉起，不用先手动 `dev up`。
#   主进程会探一次 /health，没起就在仓库根目录跑 dev.cmd up（WSL 常驻 + docker compose，幂等）。
#   想关掉自动启动、只复用已在跑的平台：设环境变量 AM_PLATFORM=0 再启动工作台。
#   平台冷启动约 10~60 秒，启动页会显示「平台启动中…」；面板请求会等它就绪再发。
