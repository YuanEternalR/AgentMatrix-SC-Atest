name: agentmatrix-sc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmatrix_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-agentmatrix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentmatrix} -d ${POSTGRES_DB:-agentmatrix}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6380:6379"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # 开发期挂载源码：改代码不必重建镜像，alembic 生成的迁移也能落回宿主机
    volumes:
      - ../apps/api:/app
      # 只读挂载测试：宿主机没装 SQLAlchemy/FastAPI 时，需要 ORM 的用例在容器里跑
      # 部分用例还会 import scripts/ 下的分析脚本，一并挂上
      - ../tests:/tests:ro
      - ../scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "app.worker.main"]

  web:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://api:8000
    command: >
      sh -c "[ -x node_modules/.bin/vite ] || npm install --no-audit --no-fund;
             npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../apps/web:/app
      - webnode:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  webnode:
