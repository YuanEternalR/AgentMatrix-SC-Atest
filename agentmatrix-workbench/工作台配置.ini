# AgentMatrix-SC 工作台配置
#
# DSH_PORT：本机正在运行的 DSH Web GUI 端口。
#   工作台不再自己拉起引擎，而是复用这个端口上的实例（模板 main.js 的 reuse 路径）。
#   DSH 换了端口时只改这里，不用动代码。
#   查端口：DSH 界面地址栏里的 http://127.0.0.1:<端口>
DSH_PORT=58360

# 说明：面板里嵌的 AgentMatrix 站点与接口由平台自己提供
#   站点   http://127.0.0.1:5173
#   接口   http://127.0.0.1:8000
# 启动前先确认：在 agentmatrix-sc 根目录跑 `dev up`，`dev ps` 全部 healthy。
