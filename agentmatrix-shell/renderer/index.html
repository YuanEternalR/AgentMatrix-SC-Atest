<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AgentMatrix-SC 工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">AM</span>
          <span class="brand-text">AgentMatrix-SC<small>供应链智能体矩阵 · 工作台</small></span>
        </div>

        <nav class="tabs" id="tabs" aria-label="场景"></nav>

        <div class="topbar-right">
          <span class="health" id="health" title="后端 / 前端连通状态">检测中…</span>
          <button class="btn" id="reload" title="刷新当前场景的面板（Ctrl+R）">刷新面板</button>
        </div>
      </header>

      <main class="stage">
        <div class="grid" id="grid"></div>
      </main>

      <footer class="statusbar">
        <span id="status-left">就绪</span>
        <span id="status-right"></span>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
